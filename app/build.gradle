apply plugin: 'com.android.application'

android {
    namespace 'io.github.lazyimmortal.bypass'
    compileSdk 30

    defaultConfig {
        applicationId "io.github.lazyimmortal.bypass"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
